[project]
name = "ai-media-generation"
version = "0.1.0"
description = "CLI tools for AI image and music generation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jsonschema>=4.26.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ai-media-generation = "ai_media_generation.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
